name: update legal builds

on:
  push:
    branches:
      - main
    paths:
      - "legal-mods/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: run update action in legal-builds
        run: |
          gh api repos/Minecraft-Java-Edition-Speedrunning/legal-builds/dispatches -f event_type=update-builds
    env:
        GH_TOKEN: ${{ secrets.legal_builds_token }}
